name: Public CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Install dependencies
        run: uv sync --extra dev --python 3.11
      - name: Lint
        run: uv run --extra dev ruff check app loramake scripts tests tools/ci
      - name: Test
        run: uv run --extra dev python -m pytest tests -q -ra
